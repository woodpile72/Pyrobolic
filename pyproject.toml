[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrobolic"
version = "1.0.0"
description = "A native GTK 4 media downloader powered by yt-dlp"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [{name = "Erick Woods"}]

[project.scripts]
pyrobolic = "pyrobolic.launcher:main"

[tool.setuptools]
packages = ["pyrobolic"]

[tool.setuptools.package-data]
pyrobolic = ["icons/hicolor/index.theme", "icons/hicolor/*/apps/*", "icons/hicolor/*/actions/*", "tray-icons/*.png"]
